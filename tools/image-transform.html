<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="图片/GIF 拖拽处理工具：旋转、四向对称翻折、万花筒，支持动态 GIF 预览与导出">
  <title>图片/GIF 拖拽处理工具 | 旋转 · 对称翻折 · 万花筒</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', 'SF Pro Text', 'Inter', 'Roboto', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 1.5rem;
    }

    .card {
      max-width: 920px;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(2px);
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 4px 12px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .header {
      background: linear-gradient(135deg, #10182f 0%, #1a253f 100%);
      padding: 1.8rem 2rem;
      color: white;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .back-link {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
      padding: 0.35rem 0.75rem;
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }

    .back-link:hover {
      color: white;

    }

    .header h1 {
      margin: 0;
      font-weight: 600;
      font-size: 1.9rem;

    .header h1::before {

    .header p {
      margin: 0.6rem 0 0;

    .status-bar {

    .status-bar.warn { color: #b45309; }

    .drop-zone {
      position: relative;

        #f8fafd;

    #workCanvas {
      max-width: 100%;

    .tips {

    @media (max-width: 640px) {
      body { padding: 0.75rem; }
      .content { padding: 1.2rem 1.2rem 1.5rem; }
      .header { padding: 1.4rem 1.2rem; }

      .drop-zone { min-height: 300px; }
      .btn { padding: 0.5rem 0.75rem; font-size: 0.8rem; }

      .slider-group input[type="range"] { flex: 1; }

<body>
  <div class="card">
    <div class="header">
      <div class="header-top">
        <div>
          <h1>图片/GIF 拖拽处理</h1>
          <p>旋转 · 四向对称翻折 · 万花筒 · 动态 GIF 预览 / 导出</p>
        </div>
        <a class="back-link" href="../index.html">← 返回首页</a>
      </div>
    </div>

    <div class="content">
      <div id="statusBar" class="status-bar">等待拖入图片…</div>

      <div class="toolbar" role="toolbar" aria-label="图片处理工具">
        <button type="button" class="btn" id="btnRotate" disabled title="累计旋转 90°">旋转 90°</button>
        <button type="button" class="btn" id="btnFoldLtr" disabled title="把左侧半边镜像复制到右侧">左→右</button>
        <button type="button" class="btn" id="btnFoldRtl" disabled title="把右侧半边镜像复制到左侧">右→左</button>
        <button type="button" class="btn" id="btnFoldTtb" disabled title="把上侧半边镜像复制到下侧">上→下</button>
        <button type="button" class="btn" id="btnFoldBtt" disabled title="把下侧半边镜像复制到上侧">下→上</button>
        <button type="button" class="btn" id="btnKaleido" disabled title="开关万花筒效果">万花筒</button>

        <label class="slider-group disabled" id="powerGroup" title="万花筒分片数量">
          <span>强度</span>
          <input type="range" id="powerSlider" min="1" max="12" value="6" disabled>
          <span id="powerValue">6</span>
        </label>

        <button type="button" class="btn ghost" id="btnReset" disabled>重置</button>
        <button type="button" class="btn primary" id="btnDownload" disabled>下载</button>
      </div>

      <div id="dropZone" class="drop-zone" tabindex="0" aria-label="图片拖拽投放区域">
        <div class="drop-hint">
          <div class="hint-title">把图片或 GIF 拖到这里</div>
          <div class="hint-sub">支持 PNG / JPEG / GIF / WebP<br>GIF 会保持动画，导出/拖出也为 GIF</div>
        </div>
        <canvas id="workCanvas" draggable="true" width="1" height="1"></canvas>
      </div>

      <p class="tips">
        提示：「左→右」等为对称翻折（保留一侧并镜像复制到另一侧）。GIF 会逐帧处理并实时播放；静态图导出 PNG，GIF 导出 GIF。
      </p>
    </div>

    <footer>&copy; 2026 xhytom · 纯前端 Canvas 工具</footer>
  </div>

  <script type="module">
    import { parseGIF, decompressFrames } from 'https://esm.sh/gifuct-js@2.1.2';
    import { GIFEncoder, quantize, applyPalette } from 'https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js';

    const dropZone = document.getElementById('dropZone');
    const canvas = document.getElementById('workCanvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    const statusBar = document.getElementById('statusBar');

    const btnRotate = document.getElementById('btnRotate');
    const btnFoldLtr = document.getElementById('btnFoldLtr');
    const btnFoldRtl = document.getElementById('btnFoldRtl');
    const btnFoldTtb = document.getElementById('btnFoldTtb');
    const btnFoldBtt = document.getElementById('btnFoldBtt');
    const btnKaleido = document.getElementById('btnKaleido');
    const btnReset = document.getElementById('btnReset');
    const btnDownload = document.getElementById('btnDownload');
    const powerSlider = document.getElementById('powerSlider');
    const powerValue = document.getElementById('powerValue');
    const powerGroup = document.getElementById('powerGroup');

    const FOLD_LABELS = { ltr: '左→右', rtl: '右→左', ttb: '上→下', btt: '下→上' };
    const MAX_DISPLAY = 720;
    const MAX_EXPORT = 720;

    /** @type {{ canvas: HTMLCanvasElement, delay: number }[]} */
    let sourceFrames = [];
    /** @type {{ canvas: HTMLCanvasElement, delay: number }[]} */
    let playFrames = [];
    let sourceFileName = 'image';
    let isGif = false;
    let hasSource = false;

    const state = {
      rotation: 0,
      foldH: null,
      foldV: null,
      kaleidoscopeEnabled: false,
      kaleidoscopePower: 6
    };

    let animTimer = 0;
    let playIndex = 0;
    let rebuildToken = 0;
    let encodeTimer = 0;
    let exportBlob = null;
    let exportObjectURL = '';
    let exportDataURL = '';
    let exportMime = 'image/png';
    let exportReady = false;
    let exporting = false;

    function setStatus(msg, type) {
      statusBar.textContent = msg;
      statusBar.className = 'status-bar' + (type ? ' ' + type : '');
    }

    function hasContent() {
      return hasSource && sourceFrames.length > 0;
    }

    function updateDownloadLabel() {
      btnDownload.textContent = isGif ? '下载 GIF' : '下载 PNG';
    }

    function setControlsEnabled(enabled) {
      [
        btnRotate, btnFoldLtr, btnFoldRtl, btnFoldTtb, btnFoldBtt,
        btnKaleido, btnReset, btnDownload
      ].forEach((btn) => { btn.disabled = !enabled; });
      updateToolbarUI();
    }

    function updateToolbarUI() {
      const on = hasContent() && state.kaleidoscopeEnabled;
      powerSlider.disabled = !on;
      powerGroup.classList.toggle('disabled', !on);
      btnKaleido.classList.toggle('active', state.kaleidoscopeEnabled);
      btnFoldLtr.classList.toggle('active', state.foldH === 'ltr');
      btnFoldRtl.classList.toggle('active', state.foldH === 'rtl');
      btnFoldTtb.classList.toggle('active', state.foldV === 'ttb');
      btnFoldBtt.classList.toggle('active', state.foldV === 'btt');
      powerValue.textContent = String(state.kaleidoscopePower);
      powerSlider.value = String(state.kaleidoscopePower);
      updateDownloadLabel();
    }

    function toggleFoldH(dir) {
      state.foldH = state.foldH === dir ? null : dir;
    }

    function toggleFoldV(dir) {
      state.foldV = state.foldV === dir ? null : dir;
    }

    function describeFolds() {
      const parts = [];
      if (state.foldH) parts.push(FOLD_LABELS[state.foldH]);
      if (state.foldV) parts.push(FOLD_LABELS[state.foldV]);
      return parts.length ? ('对称翻折：' + parts.join(' + ')) : '已关闭对称翻折';
    }

    function isImageFile(file) {
      if (!file) return false;
      if (file.type && file.type.indexOf('image/') === 0) return true;
      return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(file.name || '');
    }

    function clearExportCache() {
      exportReady = false;
      exportBlob = null;
      exportDataURL = '';
      if (exportObjectURL) {
        URL.revokeObjectURL(exportObjectURL);
        exportObjectURL = '';
      }
    }

    function stopAnimation() {
      if (animTimer) {
        clearTimeout(animTimer);
        animTimer = 0;
      }
    }

    function paintFrame(frameCanvas) {
      if (!frameCanvas) return;
      if (canvas.width !== frameCanvas.width || canvas.height !== frameCanvas.height) {
        canvas.width = frameCanvas.width;
        canvas.height = frameCanvas.height;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(frameCanvas, 0, 0);
    }

    function startAnimation() {
      stopAnimation();
      if (!playFrames.length) return;

      playIndex = 0;
      paintFrame(playFrames[0].canvas);

      if (playFrames.length === 1) return;

      const tick = () => {
        const frame = playFrames[playIndex];
        paintFrame(frame.canvas);
        const delay = Math.max(20, frame.delay || 100);
        playIndex = (playIndex + 1) % playFrames.length;
        animTimer = window.setTimeout(tick, delay);
      };
      tick();
    }

    function computeDrawSize(imgW, imgH, rotationDeg, maxSide) {
      const rad = (rotationDeg % 180) * Math.PI / 180;
      const absCos = Math.abs(Math.cos(rad));
      const absSin = Math.abs(Math.sin(rad));
      let boxW;
      let boxH;
      if (rotationDeg % 180 === 0) {
        boxW = imgW;
        boxH = imgH;
      } else if (Math.abs(rotationDeg % 180) === 90) {
        boxW = imgH;
        boxH = imgW;
      } else {
        boxW = imgW * absCos + imgH * absSin;
        boxH = imgW * absSin + imgH * absCos;
      }
      const scale = Math.min(1, maxSide / Math.max(boxW, boxH));
      return {
        drawW: imgW * scale,
        drawH: imgH * scale,
        canvasW: Math.max(1, Math.round(boxW * scale)),
        canvasH: Math.max(1, Math.round(boxH * scale))
      };
    }

    function renderRotatedFrom(source, maxSide) {
      const size = computeDrawSize(source.width, source.height, state.rotation, maxSide);
      const off = document.createElement('canvas');
      off.width = size.canvasW;
      off.height = size.canvasH;
      const octx = off.getContext('2d');
      octx.save();
      octx.translate(size.canvasW / 2, size.canvasH / 2);
      octx.rotate(state.rotation * Math.PI / 180);
      octx.drawImage(source, -size.drawW / 2, -size.drawH / 2, size.drawW, size.drawH);
      octx.restore();
      return off;
    }

    function applySymmetryFold(srcCanvas, foldH, foldV) {
      if (!foldH && !foldV) return srcCanvas;

      const w = srcCanvas.width;
      const h = srcCanvas.height;
      const out = document.createElement('canvas');
      out.width = w;
      out.height = h;
      const octx = out.getContext('2d');
      octx.drawImage(srcCanvas, 0, 0);

      if (foldH === 'ltr') {
        const halfW = Math.floor(w / 2);
        octx.save();
        octx.translate(w, 0);
        octx.scale(-1, 1);
        octx.drawImage(srcCanvas, 0, 0, halfW, h, 0, 0, halfW, h);
        octx.restore();
      } else if (foldH === 'rtl') {
        const halfW = Math.ceil(w / 2);
        const srcX = w - halfW;
        octx.save();
        octx.translate(halfW, 0);
        octx.scale(-1, 1);
        octx.drawImage(srcCanvas, srcX, 0, halfW, h, 0, 0, halfW, h);
        octx.restore();
      }

      if (foldV) {
        const mid = document.createElement('canvas');
        mid.width = w;
        mid.height = h;
        mid.getContext('2d').drawImage(out, 0, 0);

        if (foldV === 'ttb') {
          const halfH = Math.floor(h / 2);
          octx.save();
          octx.translate(0, h);
          octx.scale(1, -1);
          octx.drawImage(mid, 0, 0, w, halfH, 0, 0, w, halfH);
          octx.restore();
        } else if (foldV === 'btt') {
          const halfH = Math.ceil(h / 2);
          const srcY = h - halfH;
          octx.save();
          octx.translate(0, halfH);
          octx.scale(1, -1);
          octx.drawImage(mid, 0, srcY, w, halfH, 0, 0, w, halfH);
          octx.restore();
        }
      }

      return out;
    }

    function applyKaleidoscope(srcCanvas, power) {
      const segments = Math.max(1, Math.min(12, power | 0));
      const size = Math.min(srcCanvas.width, srcCanvas.height);
      const square = document.createElement('canvas');
      square.width = size;
      square.height = size;
      const sctx = square.getContext('2d');
      const sx = (srcCanvas.width - size) / 2;
      const sy = (srcCanvas.height - size) / 2;
      sctx.drawImage(srcCanvas, sx, sy, size, size, 0, 0, size, size);

      const out = document.createElement('canvas');
      out.width = size;
      out.height = size;
      const octx = out.getContext('2d');
      const cx = size / 2;
      const cy = size / 2;
      const slice = (Math.PI * 2) / segments;

      for (let i = 0; i < segments; i++) {
        octx.save();
        octx.translate(cx, cy);
        octx.rotate(i * slice);
        if (i % 2 === 1) {
          octx.scale(-1, 1);
          octx.rotate(slice);
        }
        octx.beginPath();
        octx.moveTo(0, 0);
        octx.arc(0, 0, cx + 1, -slice / 2, slice / 2);
        octx.closePath();
        octx.clip();
        octx.drawImage(square, -cx, -cy);
        octx.restore();
      }
      return out;
    }

    function transformOneFrame(sourceCanvas, maxSide) {
      let result = renderRotatedFrom(sourceCanvas, maxSide);
      result = applySymmetryFold(result, state.foldH, state.foldV);
      if (state.kaleidoscopeEnabled) {
        result = applyKaleidoscope(result, state.kaleidoscopePower);
      }
      return result;
    }

    async function rebuildPlayFrames() {
      if (!hasContent()) return;
      const token = ++rebuildToken;
      stopAnimation();
      clearExportCache();

      const next = [];
      for (let i = 0; i < sourceFrames.length; i++) {
        if (token !== rebuildToken) return;
        const src = sourceFrames[i];
        next.push({
          canvas: transformOneFrame(src.canvas, MAX_DISPLAY),
          delay: src.delay
        });
        // 长 GIF 时让出主线程，避免卡死 UI
        if (i % 3 === 2) {
          await new Promise((r) => setTimeout(r, 0));
        }
      }
      if (token !== rebuildToken) return;

      playFrames = next;
      startAnimation();
      updateToolbarUI();
      scheduleExportEncode();
    }

    function scheduleExportEncode() {
      clearTimeout(encodeTimer);
      encodeTimer = window.setTimeout(() => {
        prepareExport().catch((err) => {
          console.warn(err);
        });
      }, isGif ? 350 : 80);
    }

    async function prepareExport() {
      if (!hasContent() || !playFrames.length) return;
      exporting = true;
      exportReady = false;

      try {
        if (isGif && playFrames.length > 1) {
          setStatus('正在生成可导出的 GIF…', 'warn');
          const bytes = await encodeGifFromFrames(playFrames);
          if (!hasContent()) return;
          exportBlob = new Blob([bytes], { type: 'image/gif' });
          exportMime = 'image/gif';
          if (exportObjectURL) URL.revokeObjectURL(exportObjectURL);
          exportObjectURL = URL.createObjectURL(exportBlob);
          exportDataURL = await blobToDataURL(exportBlob);
          exportReady = true;
          setStatus(
            'GIF 已就绪 · ' + playFrames.length + ' 帧 · 可拖出或下载',
            'ok'
          );
        } else {
          const frame = playFrames[0].canvas;
          exportBlob = await canvasToBlob(frame, 'image/png');
          exportMime = 'image/png';
          if (exportObjectURL) URL.revokeObjectURL(exportObjectURL);
          exportObjectURL = URL.createObjectURL(exportBlob);
          exportDataURL = frame.toDataURL('image/png');
          exportReady = true;
        }
      } catch (err) {
        console.warn(err);
        exportReady = false;
        setStatus('导出准备失败，请重试下载', 'error');
      } finally {
        exporting = false;
      }
    }

    function canvasToBlob(c, type) {
      return new Promise((resolve, reject) => {
        c.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('toBlob failed'));
        }, type);
      });
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(reader.error || new Error('read failed'));
        reader.readAsDataURL(blob);
      });
    }

    async function encodeGifFromFrames(frames) {
      const gif = GIFEncoder();
      for (let i = 0; i < frames.length; i++) {
        const frame = frames[i];
        // 导出时再按 MAX_EXPORT 限制一次尺寸
        let out = frame.canvas;
        const maxSide = Math.max(out.width, out.height);
        if (maxSide > MAX_EXPORT) {
          const scale = MAX_EXPORT / maxSide;
          const scaled = document.createElement('canvas');
          scaled.width = Math.max(1, Math.round(out.width * scale));
          scaled.height = Math.max(1, Math.round(out.height * scale));
          scaled.getContext('2d').drawImage(out, 0, 0, scaled.width, scaled.height);
          out = scaled;
        }

        const fctx = out.getContext('2d');
        const imageData = fctx.getImageData(0, 0, out.width, out.height);
        const palette = quantize(imageData.data, 256);
        const index = applyPalette(imageData.data, palette);
        const delayCs = Math.max(2, Math.round((frame.delay || 100) / 10));
        gif.writeFrame(index, out.width, out.height, {
          palette,
          delay: delayCs,
          repeat: i === 0 ? 0 : undefined
        });

        if (i % 2 === 1) {
          await new Promise((r) => setTimeout(r, 0));
        }
      }
      gif.finish();
      return gif.bytes();
    }

    /**
     * 将 GIF 解码为完整合成帧（处理 disposal）
     */
    function decodeGifToFrames(arrayBuffer) {
      const gif = parseGIF(arrayBuffer);
      const frames = decompressFrames(gif, true);
      if (!frames.length) throw new Error('empty gif');

      const width = gif.lsd.width;
      const height = gif.lsd.height;
      const compose = document.createElement('canvas');
      compose.width = width;
      compose.height = height;
      const cctx = compose.getContext('2d', { willReadFrequently: true });
      cctx.clearRect(0, 0, width, height);

      /** @type {{ canvas: HTMLCanvasElement, delay: number }[]} */
      const full = [];
      let previous = null;

      for (const frame of frames) {
        const { left, top, width: fw, height: fh } = frame.dims;
        const disposal = frame.disposalType;

        if (disposal === 3) {
          previous = cctx.getImageData(0, 0, width, height);
        }

        const patch = cctx.createImageData(fw, fh);
        patch.data.set(frame.patch);
        cctx.putImageData(patch, left, top);

        const snap = document.createElement('canvas');
        snap.width = width;
        snap.height = height;
        snap.getContext('2d').drawImage(compose, 0, 0);
        full.push({
          canvas: snap,
          delay: Math.max(20, frame.delay || 100)
        });

        if (disposal === 2) {
          cctx.clearRect(left, top, fw, fh);
        } else if (disposal === 3 && previous) {
          cctx.putImageData(previous, 0, 0);
          previous = null;
        }
      }

      return full;
    }

    function imageToFrameCanvas(img) {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      return c;
    }

    async function loadImageFile(file) {
      if (!isImageFile(file)) {
        setStatus('请拖入图片文件（PNG / JPEG / GIF / WebP）', 'error');
        return;
      }

      stopAnimation();
      clearExportCache();
      rebuildToken += 1;

      isGif = (file.type === 'image/gif') || /\.gif$/i.test(file.name || '');
      sourceFileName = (file.name || 'image').replace(/\.[^.]+$/, '') || 'image';
      setStatus(isGif ? '正在解析 GIF 帧…' : '正在加载图片…', 'warn');

      try {
        if (isGif) {
          const buffer = await file.arrayBuffer();
          sourceFrames = decodeGifToFrames(buffer);
        } else {
          const dataURL = await readFileAsDataURL(file);
          const img = await loadHTMLImage(dataURL);
          sourceFrames = [{ canvas: imageToFrameCanvas(img), delay: 0 }];
        }

        hasSource = true;
        state.rotation = 0;
        state.foldH = null;
        state.foldV = null;
        state.kaleidoscopeEnabled = false;
        state.kaleidoscopePower = 6;

        dropZone.classList.add('has-image');
        setControlsEnabled(true);
        await rebuildPlayFrames();

        if (isGif) {
          setStatus(
            '已加载 GIF · ' + sourceFrames.length + ' 帧 · 动画预览中，导出为 GIF',
            'ok'
          );
        } else {
          const f = sourceFrames[0].canvas;
          setStatus(
            '已加载 · ' + file.name + ' · ' + f.width + '×' + f.height,
            'ok'
          );
        }
      } catch (err) {
        console.warn(err);
        hasSource = false;
        sourceFrames = [];
        playFrames = [];
        setControlsEnabled(false);
        dropZone.classList.remove('has-image');
        setStatus(isGif ? 'GIF 解析失败，请换一个文件试试' : '图片加载失败，请重试', 'error');
      }
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(reader.error || new Error('read failed'));
        reader.readAsDataURL(file);
      });
    }

    function loadHTMLImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('image decode failed'));
        img.src = src;
      });
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    async function ensureExportReady() {
      if (exportReady && exportBlob) return true;
      if (exporting) {
        setStatus('正在生成文件，请稍候…', 'warn');
        return false;
      }
      await prepareExport();
      return exportReady && !!exportBlob;
    }

    // ========== 拖入 ==========
    ['dragenter', 'dragover'].forEach((type) => {
      dropZone.addEventListener(type, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('dragover');
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      });
    });

    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!dropZone.contains(e.relatedTarget)) {
        dropZone.classList.remove('dragover');
      }
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) {
        setStatus('未检测到文件', 'error');
        return;
      }
      loadImageFile(files[0]);
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());

    // ========== 拖出 ==========
    canvas.addEventListener('dragstart', (e) => {
      if (!hasContent()) {
        e.preventDefault();
        return;
      }
      if (!exportReady || !exportDataURL) {
        e.preventDefault();
        setStatus(
          exporting
            ? '正在生成文件，稍后再拖，或点下载按钮'
            : '导出文件尚未就绪，请稍候或点下载',
          'warn'
        );
        scheduleExportEncode();
        return;
      }

      try {
        const dt = e.dataTransfer;
        dt.effectAllowed = 'copy';
        dt.setData('text/uri-list', exportDataURL);
        dt.setData('text/plain', exportDataURL);
        const ext = exportMime === 'image/gif' ? 'gif' : 'png';
        try {
          dt.setData(
            'DownloadURL',
            exportMime + ':' + sourceFileName + '-edited.' + ext + ':' + exportDataURL
          );
        } catch (_) { /* ignore */ }
        if (dt.setDragImage) {
          dt.setDragImage(canvas, Math.floor(canvas.width / 2), Math.floor(canvas.height / 2));
        }
      } catch (err) {
        console.warn('拖出设置失败，请使用下载按钮', err);
      }
    });

    // ========== 工具栏 ==========
    function afterTransform(msg) {
      rebuildPlayFrames().then(() => {
        if (msg) setStatus(msg, 'ok');
      });
    }

    btnRotate.addEventListener('click', () => {
      if (!hasContent()) return;
      state.rotation = (state.rotation + 90) % 360;
      afterTransform('已旋转至 ' + state.rotation + '°');
    });

    btnFoldLtr.addEventListener('click', () => {
      if (!hasContent()) return;
      toggleFoldH('ltr');
      afterTransform(describeFolds());
    });

    btnFoldRtl.addEventListener('click', () => {
      if (!hasContent()) return;
      toggleFoldH('rtl');
      afterTransform(describeFolds());
    });

    btnFoldTtb.addEventListener('click', () => {
      if (!hasContent()) return;
      toggleFoldV('ttb');
      afterTransform(describeFolds());
    });

    btnFoldBtt.addEventListener('click', () => {
      if (!hasContent()) return;
      toggleFoldV('btt');
      afterTransform(describeFolds());
    });

    btnKaleido.addEventListener('click', () => {
      if (!hasContent()) return;
      state.kaleidoscopeEnabled = !state.kaleidoscopeEnabled;
      afterTransform(
        state.kaleidoscopeEnabled
          ? '万花筒已开启 · 强度 ' + state.kaleidoscopePower
          : '万花筒已关闭'
      );
    });

    powerSlider.addEventListener('input', () => {
      state.kaleidoscopePower = parseInt(powerSlider.value, 10) || 6;
      powerValue.textContent = String(state.kaleidoscopePower);
      if (hasContent() && state.kaleidoscopeEnabled) {
        afterTransform('万花筒强度 ' + state.kaleidoscopePower);
      } else {
        updateToolbarUI();
      }
    });

    btnReset.addEventListener('click', () => {
      if (!hasContent()) return;
      state.rotation = 0;
      state.foldH = null;
      state.foldV = null;
      state.kaleidoscopeEnabled = false;
      state.kaleidoscopePower = 6;
      afterTransform('已重置为初始状态');
    });

    btnDownload.addEventListener('click', async () => {
      if (!hasContent()) return;
      const ok = await ensureExportReady();
      if (!ok || !exportBlob) return;
      const ext = exportMime === 'image/gif' ? 'gif' : 'png';
      triggerDownload(exportBlob, sourceFileName + '-edited.' + ext);
      setStatus('已下载 ' + ext.toUpperCase(), 'ok');
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (!hasContent()) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        rebuildPlayFrames();
      }, 180);
    });

    setControlsEnabled(false);
  </script>
</body>

</html>

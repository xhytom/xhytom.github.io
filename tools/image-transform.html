<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="图片/GIF 拖拽处理工具：旋转、四向对称翻折、万花筒，纯前端 Canvas 实现">
  <title>图片/GIF 拖拽处理工具 | 旋转 · 对称翻折 · 万花筒</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', 'SF Pro Text', 'Inter', 'Roboto', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 1.5rem;
    }

    .card {
      max-width: 920px;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(2px);
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 4px 12px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .header {
      background: linear-gradient(135deg, #10182f 0%, #1a253f 100%);
      padding: 1.8rem 2rem;
      color: white;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .back-link {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
      padding: 0.35rem 0.75rem;
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }

    .back-link:hover {
      color: white;
      background: rgba(255, 255, 255, 0.1);
    }

    .header h1 {
      margin: 0;
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1::before {
      content: "🖼️";
      font-size: 1.9rem;
    }

    .header p {
      margin: 0.6rem 0 0;
      opacity: 0.8;
      font-size: 0.9rem;
      font-family: monospace;
      line-height: 1.5;
    }

    .content {
      padding: 1.5rem 2rem 2rem;
    }

    /* 状态提示条 */
    .status-bar {
      min-height: 1.5rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #4b6b8f;
      font-family: monospace;
    }

    .status-bar.warn {
      color: #b45309;
    }

    .status-bar.error {
      color: #b91c1c;
    }

    .status-bar.ok {
      color: #047857;
    }

    /* 工具栏 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .btn {
      appearance: none;
      border: 2px solid #dce5f0;
      background: #fefefe;
      color: #0a2540;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.55rem 0.95rem;
      border-radius: 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
      background: #eef4fb;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .btn.primary {
      background: #10182f;
      border-color: #10182f;
      color: #fff;
    }

    .btn.primary:hover:not(:disabled) {
      background: #1a253f;
      border-color: #1a253f;
      box-shadow: 0 0 0 3px rgba(16, 24, 47, 0.18);
    }

    .btn.ghost {
      background: transparent;
    }

    .slider-group {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border: 2px solid #dce5f0;
      border-radius: 1rem;
      background: #f8fafd;
      font-size: 0.8rem;
      color: #4b6b8f;
      font-family: monospace;
    }

    .slider-group.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .slider-group input[type="range"] {
      width: 110px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    /* 投放区域 */
    .drop-zone {
      position: relative;
      width: 100%;
      min-height: 420px;
      border: 2.5px dashed #b8c7d9;
      border-radius: 1.6rem;
      background:
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.06), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(16, 24, 47, 0.05), transparent 40%),
        #f8fafd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    .drop-zone.dragover {
      border-color: #3b82f6;
      background-color: #eff6ff;
      box-shadow: inset 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .drop-zone.has-image {
      border-style: solid;
      border-color: #dce5f0;
      background: #0f172a08;
    }

    .drop-hint {
      text-align: center;
      color: #4b6b8f;
      pointer-events: none;
      padding: 1.5rem;
    }

    .drop-hint .hint-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e2a3e;
      margin-bottom: 0.45rem;
    }

    .drop-hint .hint-sub {
      font-size: 0.85rem;
      font-family: monospace;
      line-height: 1.6;
    }

    .drop-zone.has-image .drop-hint {
      display: none;
    }

    #workCanvas {
      max-width: 100%;
      max-height: 70vh;
      display: none;
      cursor: grab;
      border-radius: 0.5rem;
      background: transparent;
    }

    .drop-zone.has-image #workCanvas {
      display: block;
    }

    #workCanvas:active {
      cursor: grabbing;
    }

    .tips {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #7e8b9e;
      font-family: monospace;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      font-size: 0.7rem;
      padding: 0 2rem 1.5rem;
      color: #7e8b9e;
      font-family: monospace;
    }

    @media (max-width: 640px) {
      body {
        padding: 0.75rem;
      }

      .content {
        padding: 1.2rem 1.2rem 1.5rem;
      }

      .header {
        padding: 1.4rem 1.2rem;
      }

      .header h1 {
        font-size: 1.45rem;
      }

      .drop-zone {
        min-height: 300px;
      }

      .btn {
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
      }

      .slider-group {
        width: 100%;
        justify-content: space-between;
      }

      .slider-group input[type="range"] {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <div class="header-top">
        <div>
          <h1>图片/GIF 拖拽处理</h1>
          <p>旋转 · 四向对称翻折 · 万花筒 · 拖出 / 下载 PNG</p>
        </div>
        <a class="back-link" href="../index.html">← 返回首页</a>
      </div>
    </div>

    <div class="content">
      <div id="statusBar" class="status-bar">等待拖入图片…</div>

      <div class="toolbar" role="toolbar" aria-label="图片处理工具">
        <button type="button" class="btn" id="btnRotate" disabled title="累计旋转 90°">旋转 90°</button>
        <button type="button" class="btn" id="btnFoldLtr" disabled title="把左侧半边镜像复制到右侧">左→右</button>
        <button type="button" class="btn" id="btnFoldRtl" disabled title="把右侧半边镜像复制到左侧">右→左</button>
        <button type="button" class="btn" id="btnFoldTtb" disabled title="把上侧半边镜像复制到下侧">上→下</button>
        <button type="button" class="btn" id="btnFoldBtt" disabled title="把下侧半边镜像复制到上侧">下→上</button>
        <button type="button" class="btn" id="btnKaleido" disabled title="开关万花筒效果">万花筒</button>

        <label class="slider-group disabled" id="powerGroup" title="万花筒分片数量">
          <span>强度</span>
          <input type="range" id="powerSlider" min="1" max="12" value="6" disabled>
          <span id="powerValue">6</span>
        </label>

        <button type="button" class="btn ghost" id="btnReset" disabled>重置</button>
        <button type="button" class="btn primary" id="btnDownload" disabled>下载 PNG</button>
      </div>

      <div
        id="dropZone"
        class="drop-zone"
        tabindex="0"
        aria-label="图片拖拽投放区域"
      >
        <div class="drop-hint">
          <div class="hint-title">把图片或 GIF 拖到这里</div>
          <div class="hint-sub">支持 PNG / JPEG / GIF / WebP<br>处理后可从画布拖出，或点「下载 PNG」</div>
        </div>
        <!-- 可拖出结果的主画布 -->
        <canvas id="workCanvas" draggable="true" width="1" height="1"></canvas>
      </div>

      <p class="tips">
        提示：「左→右」等为对称翻折（保留一侧并镜像复制到另一侧），同轴两个方向互斥、可开关；水平与垂直可叠加。GIF 仅处理当前帧，导出为 PNG。
      </p>
    </div>

    <footer>&copy; 2026 xhytom · 纯前端 Canvas 工具</footer>
  </div>

  <script>
    (function () {
      'use strict';

      // ========== DOM ==========
      const dropZone = document.getElementById('dropZone');
      const canvas = document.getElementById('workCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: false });
      const statusBar = document.getElementById('statusBar');

      const btnRotate = document.getElementById('btnRotate');
      const btnFoldLtr = document.getElementById('btnFoldLtr');
      const btnFoldRtl = document.getElementById('btnFoldRtl');
      const btnFoldTtb = document.getElementById('btnFoldTtb');
      const btnFoldBtt = document.getElementById('btnFoldBtt');
      const btnKaleido = document.getElementById('btnKaleido');
      const btnReset = document.getElementById('btnReset');
      const btnDownload = document.getElementById('btnDownload');
      const powerSlider = document.getElementById('powerSlider');
      const powerValue = document.getElementById('powerValue');
      const powerGroup = document.getElementById('powerGroup');

      const FOLD_LABELS = {
        ltr: '左→右',
        rtl: '右→左',
        ttb: '上→下',
        btt: '下→上'
      };

      // ========== 状态 ==========
      /** @type {HTMLImageElement|null} */
      let sourceImage = null;
      let sourceFileName = 'image';
      let isGif = false;

      // 变换状态（可叠加）
      const state = {
        rotation: 0,              // 累计角度（度）
        // 对称翻折：把一侧半边镜像复制到另一侧（同轴互斥）
        foldH: null,              // null | 'ltr' | 'rtl'
        foldV: null,              // null | 'ttb' | 'btt'
        kaleidoscopeEnabled: false,
        kaleidoscopePower: 6      // 分片数 1–12
      };

      // 拖出用：每次重绘后缓存 Data URL
      let exportDataURL = '';
      // 显示区域最大边长，避免超大 Canvas 卡顿
      const MAX_DISPLAY = 900;

      // ========== 工具函数 ==========
      function setStatus(msg, type) {
        statusBar.textContent = msg;
        statusBar.className = 'status-bar' + (type ? ' ' + type : '');
      }

      function setControlsEnabled(enabled) {
        [
          btnRotate, btnFoldLtr, btnFoldRtl, btnFoldTtb, btnFoldBtt,
          btnKaleido, btnReset, btnDownload
        ].forEach(function (btn) {
          btn.disabled = !enabled;
        });
        updateToolbarUI();
      }

      function updateToolbarUI() {
        const on = !!sourceImage && state.kaleidoscopeEnabled;
        powerSlider.disabled = !on;
        powerGroup.classList.toggle('disabled', !on);
        btnKaleido.classList.toggle('active', state.kaleidoscopeEnabled);
        btnFoldLtr.classList.toggle('active', state.foldH === 'ltr');
        btnFoldRtl.classList.toggle('active', state.foldH === 'rtl');
        btnFoldTtb.classList.toggle('active', state.foldV === 'ttb');
        btnFoldBtt.classList.toggle('active', state.foldV === 'btt');
        powerValue.textContent = String(state.kaleidoscopePower);
        powerSlider.value = String(state.kaleidoscopePower);
      }

      /** 切换水平对称翻折：再次点击同一方向则关闭 */
      function toggleFoldH(dir) {
        state.foldH = state.foldH === dir ? null : dir;
      }

      /** 切换垂直对称翻折：再次点击同一方向则关闭 */
      function toggleFoldV(dir) {
        state.foldV = state.foldV === dir ? null : dir;
      }

      function describeFolds() {
        var parts = [];
        if (state.foldH) parts.push(FOLD_LABELS[state.foldH]);
        if (state.foldV) parts.push(FOLD_LABELS[state.foldV]);
        return parts.length ? ('对称翻折：' + parts.join(' + ')) : '已关闭对称翻折';
      }

      function isImageFile(file) {
        if (!file) return false;
        if (file.type && file.type.indexOf('image/') === 0) return true;
        // 部分环境 MIME 为空，兜底按扩展名判断
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(file.name || '');
      }

      /**
       * 计算在旋转后包围盒尺寸，并等比缩放到不超过 maxSide
       */
      function computeDrawSize(imgW, imgH, rotationDeg, maxSide) {
        var rad = (rotationDeg % 180) * Math.PI / 180;
        // 旋转后包围盒（镜像不改变包围盒尺寸）
        var absCos = Math.abs(Math.cos(rad));
        var absSin = Math.abs(Math.sin(rad));
        var boxW, boxH;
        if (rotationDeg % 180 === 0) {
          boxW = imgW;
          boxH = imgH;
        } else if (Math.abs(rotationDeg % 180) === 90) {
          boxW = imgH;
          boxH = imgW;
        } else {
          boxW = imgW * absCos + imgH * absSin;
          boxH = imgW * absSin + imgH * absCos;
        }

        var scale = Math.min(1, maxSide / Math.max(boxW, boxH));
        return {
          drawW: imgW * scale,
          drawH: imgH * scale,
          canvasW: Math.max(1, Math.round(boxW * scale)),
          canvasH: Math.max(1, Math.round(boxH * scale)),
          scale: scale
        };
      }

      /**
       * 将源图按旋转画到离屏 Canvas（不含对称翻折 / 万花筒）
       */
      function renderRotated() {
        var size = computeDrawSize(
          sourceImage.naturalWidth,
          sourceImage.naturalHeight,
          state.rotation,
          MAX_DISPLAY
        );

        var off = document.createElement('canvas');
        off.width = size.canvasW;
        off.height = size.canvasH;
        var octx = off.getContext('2d');

        // 以画布中心为变换中心，避免旋转后偏移
        octx.save();
        octx.translate(size.canvasW / 2, size.canvasH / 2);
        octx.rotate(state.rotation * Math.PI / 180);
        octx.drawImage(
          sourceImage,
          -size.drawW / 2,
          -size.drawH / 2,
          size.drawW,
          size.drawH
        );
        octx.restore();

        return off;
      }

      /**
       * 对称翻折：保留指定半边，镜像复制到另一半
       * foldH: 'ltr' 左→右 / 'rtl' 右→左
       * foldV: 'ttb' 上→下 / 'btt' 下→上
       * 水平与垂直可叠加（先水平再垂直）
       */
      function applySymmetryFold(srcCanvas, foldH, foldV) {
        if (!foldH && !foldV) return srcCanvas;

        var w = srcCanvas.width;
        var h = srcCanvas.height;
        var out = document.createElement('canvas');
        out.width = w;
        out.height = h;
        var octx = out.getContext('2d');

        // 先铺满原图，再覆盖镜像半边
        octx.drawImage(srcCanvas, 0, 0);

        if (foldH === 'ltr') {
          // 左侧半边 → 镜像到右侧
          var halfW = Math.floor(w / 2);
          octx.save();
          octx.translate(w, 0);
          octx.scale(-1, 1);
          octx.drawImage(srcCanvas, 0, 0, halfW, h, 0, 0, halfW, h);
          octx.restore();
        } else if (foldH === 'rtl') {
          // 右侧半边 → 镜像到左侧
          var halfW2 = Math.ceil(w / 2);
          var srcX = w - halfW2;
          octx.save();
          octx.translate(halfW2, 0);
          octx.scale(-1, 1);
          octx.drawImage(srcCanvas, srcX, 0, halfW2, h, 0, 0, halfW2, h);
          octx.restore();
        }

        // 垂直翻折基于「当前已含水平翻折」的结果再处理
        if (foldV) {
          var mid = document.createElement('canvas');
          mid.width = w;
          mid.height = h;
          mid.getContext('2d').drawImage(out, 0, 0);

          if (foldV === 'ttb') {
            // 上侧半边 → 镜像到下侧
            var halfH = Math.floor(h / 2);
            octx.save();
            octx.translate(0, h);
            octx.scale(1, -1);
            octx.drawImage(mid, 0, 0, w, halfH, 0, 0, w, halfH);
            octx.restore();
          } else if (foldV === 'btt') {
            // 下侧半边 → 镜像到上侧
            var halfH2 = Math.ceil(h / 2);
            var srcY = h - halfH2;
            octx.save();
            octx.translate(0, halfH2);
            octx.scale(1, -1);
            octx.drawImage(mid, 0, srcY, w, halfH2, 0, 0, w, halfH2);
            octx.restore();
          }
        }

        return out;
      }

      /**
       * 原生 Canvas 万花筒：以中心为轴，按分片数做扇区裁剪 + 交替镜像
       * power 控制扇区数量，数值越大分片越密
       */
      function applyKaleidoscope(srcCanvas, power) {
        var segments = Math.max(1, Math.min(12, power | 0));
        var size = Math.min(srcCanvas.width, srcCanvas.height);
        // 居中裁成正方形作为万花筒源
        var square = document.createElement('canvas');
        square.width = size;
        square.height = size;
        var sctx = square.getContext('2d');
        var sx = (srcCanvas.width - size) / 2;
        var sy = (srcCanvas.height - size) / 2;
        sctx.drawImage(srcCanvas, sx, sy, size, size, 0, 0, size, size);

        var out = document.createElement('canvas');
        out.width = size;
        out.height = size;
        var octx = out.getContext('2d');

        var cx = size / 2;
        var cy = size / 2;
        // 每个扇区的角度；交替镜像形成经典万花筒对称
        var slice = (Math.PI * 2) / segments;

        for (var i = 0; i < segments; i++) {
          octx.save();
          octx.translate(cx, cy);
          octx.rotate(i * slice);

          // 奇数扇区做镜像，产生对称花纹
          if (i % 2 === 1) {
            octx.scale(-1, 1);
            octx.rotate(slice);
          }

          // 裁剪为三角形/扇形楔片
          octx.beginPath();
          octx.moveTo(0, 0);
          octx.arc(0, 0, cx + 1, -slice / 2, slice / 2);
          octx.closePath();
          octx.clip();

          octx.drawImage(square, -cx, -cy);
          octx.restore();
        }

        return out;
      }

      /**
       * 统一重绘：根据状态叠加变换并刷新画布 / 拖出缓存
       */
      function redraw() {
        if (!sourceImage) return;

        // 管线：旋转 → 四向对称翻折 → 万花筒
        var rotated = renderRotated();
        var folded = applySymmetryFold(rotated, state.foldH, state.foldV);
        var result = state.kaleidoscopeEnabled
          ? applyKaleidoscope(folded, state.kaleidoscopePower)
          : folded;

        canvas.width = result.width;
        canvas.height = result.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(result, 0, 0);

        // 缓存导出 Data URL，供拖出使用（同步准备，避免 dragstart 异步问题）
        try {
          exportDataURL = canvas.toDataURL('image/png');
        } catch (e) {
          exportDataURL = '';
        }

        updateToolbarUI();
      }

      /**
       * 加载拖入的图片文件
       */
      function loadImageFile(file) {
        if (!isImageFile(file)) {
          setStatus('请拖入图片文件（PNG / JPEG / GIF / WebP）', 'error');
          return;
        }

        isGif = (file.type === 'image/gif') || /\.gif$/i.test(file.name || '');
        sourceFileName = (file.name || 'image').replace(/\.[^.]+$/, '') || 'image';

        var reader = new FileReader();
        reader.onerror = function () {
          setStatus('读取文件失败，请重试', 'error');
        };
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            sourceImage = img;
            // 重置变换
            state.rotation = 0;
            state.foldH = null;
            state.foldV = null;
            state.kaleidoscopeEnabled = false;
            state.kaleidoscopePower = 6;

            dropZone.classList.add('has-image');
            setControlsEnabled(true);
            redraw();

            if (isGif) {
              setStatus('已加载 GIF（仅处理当前帧，导出为 PNG）· ' + file.name, 'warn');
            } else {
              setStatus('已加载 · ' + file.name + ' · ' + img.naturalWidth + '×' + img.naturalHeight, 'ok');
            }
          };
          img.onerror = function () {
            setStatus('图片解码失败，请换一张试试', 'error');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      // ========== 拖入事件 ==========
      ;['dragenter', 'dragover'].forEach(function (type) {
        dropZone.addEventListener(type, function (e) {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add('dragover');
          if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        });
      });

      dropZone.addEventListener('dragleave', function (e) {
        e.preventDefault();
        e.stopPropagation();
        // 仅当真正离开投放区时取消高亮
        if (!dropZone.contains(e.relatedTarget)) {
          dropZone.classList.remove('dragover');
        }
      });

      dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');

        var files = e.dataTransfer && e.dataTransfer.files;
        if (!files || !files.length) {
          setStatus('未检测到文件', 'error');
          return;
        }
        loadImageFile(files[0]);
      });

      // 阻止页面级别默认拖放打开文件
      window.addEventListener('dragover', function (e) { e.preventDefault(); });
      window.addEventListener('drop', function (e) { e.preventDefault(); });

      // ========== 画布拖出保存 ==========
      canvas.addEventListener('dragstart', function (e) {
        if (!sourceImage || !exportDataURL) {
          e.preventDefault();
          return;
        }
        try {
          var dt = e.dataTransfer;
          dt.effectAllowed = 'copy';
          // 常见浏览器可用的拖出 MIME
          dt.setData('text/uri-list', exportDataURL);
          dt.setData('text/plain', exportDataURL);
          // 部分 Chromium 环境可识别 DownloadURL（格式：mime:filename:url）
          try {
            dt.setData(
              'DownloadURL',
              'image/png:' + sourceFileName + '-edited.png:' + exportDataURL
            );
          } catch (_) { /* 忽略不支持的类型 */ }

          // 设置拖拽预览图
          if (dt.setDragImage) {
            dt.setDragImage(canvas, canvas.width / 2, canvas.height / 2);
          }
        } catch (err) {
          // 拖出失败不抛错，用户可用下载按钮兜底
          console.warn('拖出设置失败，请使用下载按钮', err);
        }
      });

      // ========== 工具栏操作 ==========
      btnRotate.addEventListener('click', function () {
        if (!sourceImage) return;
        state.rotation = (state.rotation + 90) % 360;
        redraw();
        setStatus('已旋转至 ' + state.rotation + '°', 'ok');
      });

      btnFoldLtr.addEventListener('click', function () {
        if (!sourceImage) return;
        toggleFoldH('ltr');
        redraw();
        setStatus(describeFolds(), 'ok');
      });

      btnFoldRtl.addEventListener('click', function () {
        if (!sourceImage) return;
        toggleFoldH('rtl');
        redraw();
        setStatus(describeFolds(), 'ok');
      });

      btnFoldTtb.addEventListener('click', function () {
        if (!sourceImage) return;
        toggleFoldV('ttb');
        redraw();
        setStatus(describeFolds(), 'ok');
      });

      btnFoldBtt.addEventListener('click', function () {
        if (!sourceImage) return;
        toggleFoldV('btt');
        redraw();
        setStatus(describeFolds(), 'ok');
      });

      btnKaleido.addEventListener('click', function () {
        if (!sourceImage) return;
        state.kaleidoscopeEnabled = !state.kaleidoscopeEnabled;
        redraw();
        setStatus(
          state.kaleidoscopeEnabled
            ? '万花筒已开启 · 强度 ' + state.kaleidoscopePower
            : '万花筒已关闭',
          'ok'
        );
      });

      powerSlider.addEventListener('input', function () {
        state.kaleidoscopePower = parseInt(powerSlider.value, 10) || 6;
        powerValue.textContent = String(state.kaleidoscopePower);
        if (sourceImage && state.kaleidoscopeEnabled) {
          redraw();
        } else {
          updateToolbarUI();
        }
      });

      btnReset.addEventListener('click', function () {
        if (!sourceImage) return;
        state.rotation = 0;
        state.foldH = null;
        state.foldV = null;
        state.kaleidoscopeEnabled = false;
        state.kaleidoscopePower = 6;
        redraw();
        setStatus('已重置为初始状态', 'ok');
      });

      /**
       * 下载当前画布为 PNG（拖出失败时的兜底）
       */
      btnDownload.addEventListener('click', function () {
        if (!sourceImage) return;
        try {
          canvas.toBlob(function (blob) {
            if (!blob) {
              // 兜底：使用 Data URL
              var a = document.createElement('a');
              a.href = exportDataURL || canvas.toDataURL('image/png');
              a.download = sourceFileName + '-edited.png';
              a.click();
              setStatus('已触发下载 PNG', 'ok');
              return;
            }
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = sourceFileName + '-edited.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
            setStatus('已下载 PNG', 'ok');
          }, 'image/png');
        } catch (err) {
          setStatus('导出失败，请重试', 'error');
        }
      });

      // 窗口尺寸变化时按需重绘（保持适配）
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        if (!sourceImage) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(redraw, 150);
      });

      // 初始：控件禁用
      setControlsEnabled(false);
    })();
  </script>
</body>

</html>
